# ============================================================================
# Databricks Asset Bundle Configuration
# ============================================================================
# UPDATE these values for your domain:
#   1. bundle.name          — your repo name (e.g., astra-general-ledger)
#   2. bundle.git.origin_url — your GitHub repo URL
#   3. pipeline name/key    — descriptive pipeline identifier
#   4. schema               — your DLT schema name
#   5. email_recipients     — your team's notification list
#   6. quartz_cron_expression — your preferred schedule
#
# Two supported dev/prod layouts:
#   A. SEPARATE WORKSPACES (default below)
#      - Different `host` URLs per target (e.g., adb-dev.xx vs adb-prod.xx)
#      - Different catalogs per target (e.g., silver_astra_dev vs silver_astra)
#      - Used by: Astra-Accounts-Payable, Astra-Accounts-Receivable
#
#   B. SINGLE WORKSPACE, DEV/PROD SPLIT BY SCHEMA
#      - Same `host` URL for both targets
#      - Same catalog, different schema (e.g., foo_dev vs foo in the same catalog)
#      - Used by: Helios-HVACR
#      - To adopt: set dev + prod `host` to the same value and override only
#        `schema` (and `catalog`, if needed) per target.
# ============================================================================

bundle:
  name: astra-dlt-template  # <-- RENAME to your repo name
  git:
    origin_url: https://github.com/astra-insights/Astra-DLT-Template.git  # <-- UPDATE

sync:
  include:
    - "Transformations/**"

resources:
  pipelines:
    my_pipeline:  # <-- RENAME to your pipeline key (e.g., gl_pipeline, wip_pipeline)
      name: "Astra DLT Template - Dev"  # <-- UPDATE display name
      catalog: "silver_astra_dev"
      schema: "my_domain"  # <-- UPDATE to your schema (e.g., general_ledger, accounts_receivable)
      photon: true
      serverless: true
      continuous: false
      development: true  # Set to true during active development for faster iteration and live table inspection. Set to false for production-like runs.
      channel: "CURRENT"
      configuration:
        "catalog_silver_opco": "silver_opco_dev"
        "catalog_silver_astra": "silver_astra_dev"
        "pipelines.maxFlowRetryAttempts": "0"
        "pipelines.numUpdateRetryAttempts": "0"
      libraries:
        - glob:
            include: "./Transformations/**"

targets:
  dev:
    workspace:
      host: https://adb-XXXXX.XX.azuredatabricks.net  # <-- UPDATE to your workspace URL
      profile: dev
    default: true

  prod:
    resources:
      pipelines:
        my_pipeline:  # <-- MUST match the pipeline key above
          name: "Astra DLT Template - Prod"  # <-- UPDATE display name
          catalog: "silver_astra"
          development: false
          configuration:
            "catalog_silver_opco": "silver_opco"
            "catalog_silver_astra": "silver_astra"
            "pipelines.maxFlowRetryAttempts": "0"
            "pipelines.numUpdateRetryAttempts": "0"
          notifications:
            - email_recipients:
                # <-- UPDATE with your team's email addresses
                - ryan@astraservicepartners.com
              alerts:
                - on-update-failure
                - on-flow-failure
      jobs:
        my_pipeline_scheduler:  # <-- RENAME to match your pipeline
          name: "Astra DLT Template Scheduler - Prod"  # <-- UPDATE display name
          email_notifications:
            on_failure:
              # <-- UPDATE with your team's email addresses
              - ryan@astraservicepartners.com
          schedule:
            # Runs at :15 past each hour to allow bronze pipelines to complete first
            quartz_cron_expression: "0 15 7-18 ? * MON-FRI"
            timezone_id: "America/Chicago"
          tasks:
            - task_key: "run_pipeline"  # <-- UPDATE task key
              max_retries: 0
              pipeline_task:
                pipeline_id: "${resources.pipelines.my_pipeline.id}"  # <-- MUST match pipeline key
                full_refresh: false
    workspace:
      host: https://adb-XXXXX.XX.azuredatabricks.net  # <-- UPDATE to your prod workspace URL (or same as dev)
      profile: prod
    git:
      branch: prod
